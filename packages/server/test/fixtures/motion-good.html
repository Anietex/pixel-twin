<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; }
    section { padding: 24px; }
    .btn { display: inline-block; width: 120px; height: 44px; background: #25f; color: #fff; border: 0; }
    .link { color: #333; }
    .strip { width: 400px; height: 40px; overflow: hidden; }
    .track { display: flex; width: max-content; }
    .logo { width: 150px; height: 40px; flex: none; }
    .reveal { height: 200px; background: #eee; }
    .tall { height: 1600px; }
    @media (prefers-reduced-motion: no-preference) {
      .btn { transition: transform 200ms ease-out; }
      .btn:hover { transform: translateY(-2px); }
      .link { transition: color 300ms ease-out; }
      .link:hover { color: #25f; }
      /* Two copies of the logos moved by exactly one copy's width: the loop is seamless. */
      .track { animation: slide 2s linear infinite; }
      @keyframes slide { to { transform: translateX(-50%); } }
    }
  </style>
</head>
<body>
  <section id="motion" data-figma-id="1:1">
    <button class="btn" data-figma-id="1:3">Get started</button>
    <a class="link" href="#" data-figma-id="1:2">Read more</a>
    <div class="strip" data-figma-id="1:4">
      <div class="track">
        <span class="logo" style="background:#f33"></span><span class="logo" style="background:#3f3"></span>
        <span class="logo" style="background:#33f"></span><span class="logo" style="background:#fc3"></span>
        <span class="logo" style="background:#f33"></span><span class="logo" style="background:#3f3"></span>
        <span class="logo" style="background:#33f"></span><span class="logo" style="background:#fc3"></span>
      </div>
    </div>
    <div class="tall"></div>
    <div class="reveal" data-figma-id="1:5"></div>
  </section>
</body>
</html>
