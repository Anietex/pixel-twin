<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #FCFAF4; }
    .hero { display: block; width: 400px; height: 400px; }
    .from { color: #AAA59B; font-size: 14px; }
    .banner { background-image: linear-gradient(#333, #666); color: #fff; padding: 16px; }
    .spacer { height: 1400px; }
    @font-face { font-family: "Brand Sans"; src: local("Helvetica"); }
    .brand { font-family: "Brand Sans"; }
    .wide { display: block; width: 300px; }
  </style>
  <script src="big.js"></script>
</head>
<body>
  <img class="hero" src="big.png">
  <h2>Gifts</h2>
  <p class="from" data-figma-id="1:2">FROM $12</p>
  <h4>Details</h4>
  <div class="banner" data-figma-id="1:3">Free shipping</div>
  <button data-figma-id="1:4"><svg width="20" height="20"><circle cx="10" cy="10" r="8"/></svg></button>
  <img src="small.png" alt="Badge" loading="lazy" width="40" height="40">
  <img src="medium.png" alt="Thumbnail" style="width: 40px; height: 40px">
  <p class="brand">Brand</p>
  <a href="javascript:void(0)">Do it</a>
  <a href="https://example.com/" target="_blank">Partner</a>
  <svg width="10" height="10"><circle cx="5" cy="5" r="4" onclick="void 0"/></svg>
  <img class="wide" src="wide.png" alt="Wide photo">
  <div class="spacer"></div>
  <img src="small.png?late" alt="Late" width="40" height="40">
</body>
</html>
