<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #FCFAF4; }
    .hero { display: block; width: 300px; height: 300px; }
    .from { color: #595650; font-size: 14px; }
    .spacer { height: 1400px; }
    @font-face { font-family: "Brand Sans"; src: local("Helvetica"); font-display: swap; }
    .brand { font-family: "Brand Sans"; }
  </style>
  <script src="small.js"></script>
</head>
<body>
  <h1>Gifts</h1>
  <img class="hero" src="medium.png" alt="A gift box" fetchpriority="high">
  <h2>Details</h2>
  <p class="from">FROM $12</p>
  <p class="brand">Brand</p>
  <a href="https://example.com/" target="_blank" rel="noopener noreferrer">Partner</a>
  <button aria-label="Save"><svg width="20" height="20"><circle cx="10" cy="10" r="8"/></svg></button>
  <div class="spacer"></div>
  <img src="small.png" alt="Badge" loading="lazy" width="40" height="40">
</body>
</html>
